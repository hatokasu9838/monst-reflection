<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>モンスト 反射線シミュレーター</title>
<style>
:root{--bg:#0b1020;--panel:#121a2f;--line:#263452;--txt:#f4f7ff;--muted:#9eabc7;--accent:#39b9ff;--accent2:#8dff6a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:linear-gradient(180deg,#08101c,#0e1424);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
body{min-height:100vh}
.app{max-width:980px;margin:0 auto;padding:14px 12px 28px}
h1{font-size:20px;margin:2px 0 4px;font-weight:800}
.sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.panel{background:rgba(18,26,47,.92);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 12px 34px rgba(0,0,0,.25)}
.controls{display:grid;grid-template-columns:1fr;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
label{font-size:12px;color:var(--muted)}
button,.fileBtn,select,input[type=number]{height:38px;border-radius:10px;border:1px solid #344360;background:#18233d;color:var(--txt);font-size:14px}
button,.fileBtn{padding:0 12px;font-weight:700;cursor:pointer}
button.primary{background:#153e5b;border-color:#2278a5}
button.active{outline:2px solid var(--accent);box-shadow:0 0 0 4px rgba(57,185,255,.15)}
input[type=number]{width:72px;padding:0 8px}
select{padding:0 10px}
.fileBtn{display:inline-flex;align-items:center;justify-content:center}
input[type=file]{display:none}
.badge{display:inline-flex;align-items:center;height:28px;padding:0 9px;border-radius:999px;background:#17233c;color:#c8d5f3;font-size:12px}
.help{font-size:12px;line-height:1.55;color:#b5c0d9;margin-top:6px}
.stageWrap{background:#03070f;border:1px solid var(--line);border-radius:16px;padding:8px;overflow:auto;touch-action:none}
.stage{position:relative;width:max-content;max-width:none;margin:0 auto}
canvas{display:block;max-width:min(94vw,960px);height:auto;touch-action:none;background:#000;border-radius:10px}
.overlay{position:absolute;inset:0;pointer-events:none}
.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.small{font-size:11px;color:#7f8eac}
.wallHint{font-size:12px;color:#c8d5f3;margin-top:8px}
.wallFields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.field{display:flex;flex-direction:column;gap:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#9eabc7;margin-top:9px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
@media(min-width:720px){.controls{grid-template-columns:1.35fr 1fr}.wallFields{max-width:460px}}
</style>
</head>
<body>
<div class="app">
  <h1>🎯 モンスト反射線シミュレーター</h1>
  <div class="sub">スクショを背景にして、キャラからドラッグすると壁での反射をリアルタイム表示します。</div>

  <div class="panel">
    <div class="controls">
      <div>
        <div class="row">
          <label class="fileBtn" for="file">📷 スクショを選択</label>
          <input id="file" type="file" accept="image/*">
          <button id="useDefault" type="button">サンプルに戻す</button>
        </div>
        <div class="help">最初にキャラの中心を1回タップ。以後は<strong>白い照準線だけ</strong>をドラッグして角度を変更します。キャラを触っても始点は動きません。</div>
      </div>
      <div>
        <div class="row">
          <label>反射回数</label>
          <select id="bounces"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select>
          <button id="monst" class="active" type="button">モンスト方式</button>
          <button id="direct" type="button">ドラッグ方向</button>
          <button id="clear" type="button">線を消す</button>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="row"><strong style="font-size:14px">壁エリア</strong><span class="badge">％で調整</span></div>
    <div class="wallHint">スクショによって黒帯やHUDが入るため、反射させたい範囲を4辺で調整できます。</div>
    <div class="wallFields" style="margin-top:9px">
      <div class="field"><label>左</label><input id="left" type="number" min="0" max="49" step="0.1"></div>
      <div class="field"><label>右</label><input id="right" type="number" min="51" max="100" step="0.1"></div>
      <div class="field"><label>上</label><input id="top" type="number" min="0" max="49" step="0.1"></div>
      <div class="field"><label>下</label><input id="bottom" type="number" min="51" max="100" step="0.1"></div>
    </div>
  </div>

  <div class="stageWrap" id="stageWrap">
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
    </div>
  </div>
  <div class="status" id="status">
    <span class="badge">始点：未設定</span>
    <span class="badge">方向：未設定</span>
    <span class="badge">反射：0</span>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:#43e6ff"></i>壁枠</span>
    <span><i class="dot" style="background:#ffffff"></i>予測線</span>
    <span><i class="dot" style="background:#ff3b30"></i>スタート→ドラッグ</span>
  </div>
</div>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const fileInput = document.getElementById('file');
const bouncesEl = document.getElementById('bounces');
const status = document.getElementById('status');
const leftEl = document.getElementById('left');
const rightEl = document.getElementById('right');
const topEl = document.getElementById('top');
const bottomEl = document.getElementById('bottom');
let img = new Image();
let imgReady = false;
let drawState = null;
let touchActive = false;
let mode = 'monst';

const wall = {l:0,r:100,t:11.6,b:70.0};
// クエストフィールドの固定範囲（スクショ上の実際のプレイ領域）
const LOCK_WALL = true;
function setWallFields(){leftEl.value=wall.l;rightEl.value=wall.r;topEl.value=wall.t;bottomEl.value=wall.b}
setWallFields();

function loadImage(src){
  imgReady=false;
  const im = new Image();
  im.onload=()=>{
    img=im; imgReady=true;
    canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
    stage.style.width=canvas.width+'px';
    // スクショを変えても、クエストフィールドの基準を維持する。
    if(LOCK_WALL){ wall.l=0; wall.r=100; wall.t=11.6; wall.b=70.0; setWallFields(); }
    draw();
  };
  im.onerror=()=>alert('画像を読み込めませんでした。別のスクショで試してください。');
  im.src=src;
}
loadImage(DEFAULT_SRC);

fileInput.addEventListener('change',e=>{
  const f=e.target.files?.[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>loadImage(reader.result);
  reader.readAsDataURL(f);
});
document.getElementById('useDefault').onclick=()=>{wall.l=0;wall.r=100;wall.t=11.6;wall.b=70;setWallFields();loadImage(DEFAULT_SRC)};
[ leftEl,rightEl,topEl,bottomEl ].forEach((el,i)=>{
  el.addEventListener('change',()=>{
    if(LOCK_WALL){ setWallFields(); return; }
    wall[['l','r','t','b'][i]]=Number(el.value)||0; draw();
  });
  el.addEventListener('input',()=>{
    if(LOCK_WALL){ setWallFields(); return; }
    wall[['l','r','t','b'][i]]=Number(el.value)||0; draw();
  });
});
bouncesEl.addEventListener('change',draw);
document.getElementById('clear').onclick=()=>{drawState=null;draw()};
function setMode(m){mode=m;document.getElementById('monst').classList.toggle('active',m==='monst');document.getElementById('direct').classList.toggle('active',m==='direct');if(drawState)draw()}
document.getElementById('monst').onclick=()=>setMode('monst');
document.getElementById('direct').onclick=()=>setMode('direct');

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function ptFromEvent(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(canvas.width/r.width), y:(e.clientY-r.top)*(canvas.height/r.height)};
}
function rect(){return {l:canvas.width*wall.l/100,r:canvas.width*wall.r/100,t:canvas.height*wall.t/100,b:canvas.height*wall.b/100}}
function normalize(x,y){const m=Math.hypot(x,y)||1;return {x:x/m,y:y/m}}
function makePath(start,dir,n){
  const R=rect();
  let p={x:clamp(start.x,R.l,R.r),y:clamp(start.y,R.t,R.b)};
  let d=normalize(dir.x,dir.y);
  const points=[{...p}]; let hits=0;
  const EPS=0.0001;
  for(let i=0;i<n;i++){
    let tx=Infinity,ty=Infinity;
    if(d.x>EPS)tx=(R.r-p.x)/d.x; else if(d.x<-EPS)tx=(R.l-p.x)/d.x;
    if(d.y>EPS)ty=(R.b-p.y)/d.y; else if(d.y<-EPS)ty=(R.t-p.y)/d.y;
    const t=Math.min(tx>EPS?tx:Infinity,ty>EPS?ty:Infinity);
    if(!Number.isFinite(t))break;
    const q={x:p.x+d.x*t,y:p.y+d.y*t};
    const hitX=Math.abs(t-tx)<1e-5, hitY=Math.abs(t-ty)<1e-5;
    points.push(q); hits++;
    if(hitX)d.x*=-1;
    if(hitY)d.y*=-1;
    p={x:q.x+d.x*0.01,y:q.y+d.y*0.01};
  }
  return {points,hits};
}
function updateStatus(){
  if(!drawState){status.innerHTML='<span class="badge">始点：未設定</span><span class="badge">方向：未設定</span><span class="badge">反射：0</span>';return}
  const a=drawState.start,b=drawState.current;
  const dx=b.x-a.x,dy=b.y-a.y;
  const pull=Math.round(Math.hypot(dx,dy));
  status.innerHTML=`<span class="badge">始点：${Math.round(a.x)}, ${Math.round(a.y)}</span><span class="badge">引っ張り：${pull}px</span><span class="badge">反射：${drawState.path?.hits||0}</span>`;
}
function draw(){
  if(!imgReady)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const R=rect();
  // wall guide
  ctx.save();
  ctx.strokeStyle='rgba(57,185,255,.75)';ctx.lineWidth=Math.max(3,canvas.width/240);
  ctx.setLineDash([10,8]);ctx.strokeRect(R.l,R.t,R.r-R.l,R.b-R.t);
  ctx.fillStyle='rgba(57,185,255,.08)';ctx.fillRect(R.l,R.t,R.r-R.l,R.b-R.t);
  ctx.restore();
  if(!drawState){updateStatus();return}
  // start point
  ctx.save();ctx.beginPath();ctx.arc(drawState.start.x,drawState.start.y,Math.max(9,canvas.width/85),0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.95)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#39b9ff';ctx.stroke();ctx.restore();
  // キャラを触らず、白いバッテン状の照準線だけを操作対象にする
  {
    const c=drawState.start;
    const arm=Math.max(70,canvas.width*0.10);
    const a=drawState.angle ?? 0;
    const cs=Math.cos(a), sn=Math.sin(a);
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,.95)';
    ctx.lineWidth=Math.max(5,canvas.width/130);
    ctx.lineCap='round';
    ctx.shadowColor='rgba(0,0,0,.55)';
    ctx.shadowBlur=5;
    ctx.beginPath();
    ctx.moveTo(c.x-cs*arm,c.y-sn*arm);
    ctx.lineTo(c.x+cs*arm,c.y+sn*arm);
    ctx.moveTo(c.x+sn*arm,c.y-cs*arm);
    ctx.lineTo(c.x-sn*arm,c.y+cs*arm);
    ctx.stroke();
    ctx.restore();
  }
  if(drawState.current){
    ctx.save();ctx.beginPath();ctx.moveTo(drawState.start.x,drawState.start.y);ctx.lineTo(drawState.current.x,drawState.current.y);ctx.strokeStyle='#ff3b30';ctx.lineWidth=Math.max(4,canvas.width/210);ctx.lineCap='round';ctx.setLineDash([14,10]);ctx.stroke();ctx.restore();
  }
  if(drawState.path){
    const p=drawState.path.points;
    ctx.save();ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);
    ctx.strokeStyle='#ffffff';ctx.lineWidth=Math.max(4,canvas.width/190);ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='rgba(255,255,255,.5)';ctx.shadowBlur=10;ctx.stroke();ctx.restore();
    ctx.save();ctx.fillStyle='#8dff6a';ctx.font=`700 ${Math.max(16,canvas.width/34)}px sans-serif`;for(let i=1;i<p.length;i++){ctx.beginPath();ctx.arc(p[i].x,p[i].y,Math.max(6,canvas.width/110),0,Math.PI*2);ctx.fill();ctx.fillText(String(i),p[i].x+9,p[i].y-9)}ctx.restore();
  }
  updateStatus();
}


// ===== 操作仕様 =====
// 1回目のタッチ：キャラの中心（始点）を決める
// 2回目以降：白い照準線/予測線の上だけを触って角度を変更する
// キャラそのものを触っても、始点は動かさない。
const AIM_HIT_PX = 38;
const FIRST_START_RADIUS_PX = 85;
let aimLocked = false;

function distPointToSegment(p,a,b){
  const vx=b.x-a.x, vy=b.y-a.y;
  const wx=p.x-a.x, wy=p.y-a.y;
  const vv=vx*vx+vy*vy;
  if(vv===0) return Math.hypot(p.x-a.x,p.y-a.y);
  let t=(wx*vx+wy*vy)/vv;
  t=Math.max(0,Math.min(1,t));
  const q={x:a.x+vx*t,y:a.y+vy*t};
  return Math.hypot(p.x-q.x,p.y-q.y);
}
function isOnAimGuide(p){
  if(!drawState) return false;
  // キャラ本体付近は操作対象外。ここを触っても始点は動かさない。
  const centerGap=Math.max(52,canvas.width*0.075);
  if(Math.hypot(p.x-drawState.start.x,p.y-drawState.start.y)<centerGap) return false;
  const R=rect();
  const pts=[];
  // 現在の引っ張り線
  if(drawState.current){
    pts.push([drawState.start,drawState.current]);
  }
  // 白い予測線
  if(drawState.path && drawState.path.points){
    const a=drawState.path.points;
    for(let i=0;i<a.length-1;i++) pts.push([a[i],a[i+1]]);
  }
  // キャラ周辺の白いX型タッチガイドも判定対象にする
  const c=drawState.start;
  const arm=Math.max(70,canvas.width*0.10);
  const ang=drawState.angle ?? 0;
  const dirs=[
    {x:Math.cos(ang),y:Math.sin(ang)},
    {x:-Math.cos(ang),y:-Math.sin(ang)},
    {x:-Math.sin(ang),y:Math.cos(ang)},
    {x:Math.sin(ang),y:-Math.cos(ang)}
  ];
  for(const d of dirs){
    pts.push([{x:c.x-d.x*arm,y:c.y-d.y*arm},{x:c.x+d.x*arm,y:c.y+d.y*arm}]);
  }
  return pts.some(([a,b])=>distPointToSegment(p,a,b)<=AIM_HIT_PX);
}

function pointerDown(e){
  if(e.pointerType==='mouse' && e.button!==0)return;
  e.preventDefault();
  const p=ptFromEvent(e);
  const R=rect();

  // 最初の1回だけ始点を設定。以後は絶対に動かさない。
  if(!drawState){
    const s={x:clamp(p.x,R.l,R.r),y:clamp(p.y,R.t,R.b)};
    drawState={start:s,current:s,path:null,angle:0};
    touchActive=true;
    aimLocked=true;
    canvas.setPointerCapture?.(e.pointerId);
    draw();
    return;
  }

  // 2回目以降は白い線の上だけ操作可能
  if(!isOnAimGuide(p)){
    touchActive=false;
    return;
  }

  touchActive=true;
  canvas.setPointerCapture?.(e.pointerId);
  drawState.current=p;
  const vx=p.x-drawState.start.x, vy=p.y-drawState.start.y;
  if(Math.hypot(vx,vy)>3){
    drawState.angle=Math.atan2(vy,vx);
    let dir={x:vx,y:vy};
    if(mode==='monst'){dir.x=-dir.x;dir.y=-dir.y}
    drawState.path=makePath(drawState.start,dir,Number(bouncesEl.value));
  }
  draw();
}

function pointerMove(e){
  if(!touchActive||!drawState)return;
  e.preventDefault();

  const p=ptFromEvent(e);
  const vx=p.x-drawState.start.x, vy=p.y-drawState.start.y;
  if(Math.hypot(vx,vy)<=3)return;

  // 始点は固定。動くのは角度だけ。
  drawState.current=p;
  drawState.angle=Math.atan2(vy,vx);

  let dir={x:vx,y:vy};
  if(mode==='monst'){dir.x=-dir.x;dir.y=-dir.y}
  drawState.path=makePath(drawState.start,dir,Number(bouncesEl.value));
  draw();
}

function pointerUp(e){
  if(!touchActive)return;
  touchActive=false;
  draw();
}

canvas.addEventListener('pointerdown',pointerDown,{passive:false});
canvas.addEventListener('pointermove',pointerMove,{passive:false});
canvas.addEventListener('pointerup',pointerUp,{passive:false});
canvas.addEventListener('pointercancel',pointerUp,{passive:false});

// Double-tap resets the line without disturbing the selected screenshot.
let lastTap=0;
canvas.addEventListener('pointerup',e=>{
  const now=Date.now();
  if(e.pointerType!=='mouse' && now-lastTap<280){drawState=null;draw()}
  lastTap=now;
});
</script>
</body>
