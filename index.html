<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>モンスト反射シミュレーター</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;height:100%;overflow:hidden}
body{display:flex;flex-direction:column}
#bar{height:74px;flex:0 0 74px;display:flex;align-items:center;gap:12px;padding:10px 14px;background:#151820}
button{border:1px solid #3d4658;background:#242b38;color:#fff;border-radius:13px;height:58px;padding:0 18px;font-size:18px;font-weight:700;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active{transform:scale(.97)}
#fileBtn{font-size:17px}
#count{display:flex;align-items:center;gap:4px}
#count span{min-width:30px;text-align:center}
#minus,#plus{width:64px;min-width:64px;height:58px;padding:0;font-size:30px;touch-action:manipulation}
#hide{font-size:16px}
#wrap{position:relative;flex:1;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;background:#111}
#stage{position:relative;max-width:100%;max-height:100%;touch-action:none}
#photo{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:16px;text-align:center;padding:30px}
#file{display:none}
@media(max-width:600px){
 #bar{height:74px;flex-basis:74px;gap:7px;padding:8px 8px}
 button{height:58px;padding:0 11px;font-size:16px}
 #fileBtn{font-size:15px}
}
</style>
</head>
<body>
<div id="bar">
  <button id="fileBtn">📷 スクショを選択</button>
  <input id="file" type="file" accept="image/*">
  <div id="count">
    <button id="minus">−</button><span id="n">3</span><button id="plus">＋</button>
  </div>
  <button id="hide">線を消す</button>
</div>
<div id="wrap">
  <div id="empty">スクショを選択してください</div>
  <div id="stage" hidden>
    <img id="photo" alt="">
    <canvas id="cv"></canvas>
  </div>
</div>
<script>
const file=document.getElementById('file'), fileBtn=document.getElementById('fileBtn');
const stage=document.getElementById('stage'), photo=document.getElementById('photo'), cv=document.getElementById('cv');
const ctx=cv.getContext('2d'), empty=document.getElementById('empty');
const nEl=document.getElementById('n'), plus=document.getElementById('plus'), minus=document.getElementById('minus'), hide=document.getElementById('hide');

let reflections=3, showLines=true, imgW=0,imgH=0;
let cursor={x:0,y:0}; // image coordinates
// pullAngle is the direction the user pulls the ball. The actual shot travels exactly 180° opposite.
let pullAngle=-Math.PI/4;
let active=null, lastX=0,lastY=0;

fileBtn.onclick=()=>file.click();
file.onchange=e=>{
 const f=e.target.files?.[0]; if(!f)return;
 const url=URL.createObjectURL(f);
 photo.onload=()=>{
   imgW=photo.naturalWidth; imgH=photo.naturalHeight;
   stage.hidden=false; empty.hidden=true;
   fitStage();
   // Cursor starts at center of the actual game field, not at a random old touch point.
   const b=bounds();
   cursor.x=(b.l+b.r)/2; cursor.y=(b.t+b.b)/2;
   pullAngle=-Math.PI/4; showLines=true;
   draw();
 };
 photo.src=url;
};

function fitStage(){
 const wrapW=document.getElementById('wrap').clientWidth;
 const wrapH=document.getElementById('wrap').clientHeight;
 const scale=Math.min(wrapW/imgW,wrapH/imgH);
 stage.style.width=Math.round(imgW*scale)+'px';
 stage.style.height=Math.round(imgH*scale)+'px';
 cv.width=imgW; cv.height=imgH;
}
window.addEventListener('resize',()=>{if(!stage.hidden){fitStage();draw();}});

// Fixed field boundary, based on the blue boundary in the supplied reference.
// It scales with every screenshot by percentage, so the setting UI is unnecessary.
function bounds(){
 // Fixed Monster Strike field. The old cropped reference shifted the Y coordinates;
 // use the full 710x1536 screenshot proportions for top/bottom instead.
 // Left/right are the values already confirmed by the user.
 return {l:0.046*imgW, r:0.954*imgW, t:0.115*imgH, b:0.695*imgH};
}

function draw(){
 if(!imgW)return;
 ctx.clearRect(0,0,imgW,imgH);
 if(!showLines)return;
 const b=bounds();
 drawReflection(b);
 drawCursor();
}

function drawCursor(){
 const x=cursor.x,y=cursor.y;
 // Orange glow around the ball-sized cursor.
 const rg=ctx.createRadialGradient(x,y,8,x,y,44);
 rg.addColorStop(0,'rgba(255,110,20,.40)');
 rg.addColorStop(.55,'rgba(255,110,20,.20)');
 rg.addColorStop(1,'rgba(255,110,20,0)');
 ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,44,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='rgba(255,120,25,.16)';ctx.beginPath();ctx.arc(x,y,32,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='rgba(255,90,20,.92)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,31,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle='rgba(255,190,80,.75)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,35,0,Math.PI*2);ctx.stroke();

 // Four white arms. They are the ONLY move handles.
 const L=58, gap=18, w=17;
 for(let i=0;i<4;i++){
   const a=pullAngle + i*Math.PI/2;
   const x1=x+Math.cos(a)*gap,y1=y+Math.sin(a)*gap;
   const x2=x+Math.cos(a)*(gap+L),y2=y+Math.sin(a)*(gap+L);
   ctx.strokeStyle='#fff';ctx.lineWidth=w;ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 }
}

function rayToSegment(px,py,dx,dy,x1,y1,x2,y2){
 const sx=x2-x1,sy=y2-y1;
 const den=dx*sy-dy*sx;
 if(Math.abs(den)<1e-9)return null;
 const t=((x1-px)*sy-(y1-py)*sx)/den;
 const u=((x1-px)*dy-(y1-py)*dx)/den;
 if(t>1e-7 && u>=0 && u<=1)return {t,u,x:px+dx*t,y:py+dy*t};
 return null;
}
function reflectPath(b){
 // Shoot opposite the drag/aim direction, like Monster Strike.
 let x=cursor.x,y=cursor.y;
 let dx=Math.cos(pullAngle+Math.PI),dy=Math.sin(pullAngle+Math.PI);
 // angle is the travel direction.
 const pts=[{x,y}];
 for(let k=0;k<reflections;k++){
   const hits=[
    rayToSegment(x,y,dx,dy,b.l,b.t,b.r,b.t),
    rayToSegment(x,y,dx,dy,b.r,b.t,b.r,b.b),
    rayToSegment(x,y,dx,dy,b.r,b.b,b.l,b.b),
    rayToSegment(x,y,dx,dy,b.l,b.b,b.l,b.t)
   ].filter(Boolean).sort((a,c)=>a.t-c.t);
   if(!hits.length)break;
   const h=hits[0]; pts.push({x:h.x,y:h.y});
   if(Math.abs(h.x-b.l)<1e-3||Math.abs(h.x-b.r)<1e-3) dx=-dx;
   else dy=-dy;
   x=h.x+dx*.05;y=h.y+dy*.05;
 }
 // Continue last segment to boundary/long distance.
 let ex=x+dx*Math.max(imgW,imgH)*2, ey=y+dy*Math.max(imgW,imgH)*2;
 const last= [
   rayToSegment(x,y,dx,dy,b.l,b.t,b.r,b.t),
   rayToSegment(x,y,dx,dy,b.r,b.t,b.r,b.b),
   rayToSegment(x,y,dx,dy,b.r,b.b,b.l,b.b),
   rayToSegment(x,y,dx,dy,b.l,b.b,b.l,b.t)
 ].filter(Boolean).sort((a,c)=>a.t-c.t)[0];
 if(last){ex=last.x;ey=last.y}
 pts.push({x:ex,y:ey});
 return pts;
}
function drawReflection(b){
 const pts=reflectPath(b);
 ctx.strokeStyle='rgba(255,255,255,.95)';
 ctx.lineWidth=4;
 ctx.lineCap='round';ctx.lineJoin='round';
 ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
 for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
 ctx.stroke();
 // Small numbered markers at reflection points.
 ctx.font='bold 20px -apple-system,BlinkMacSystemFont,sans-serif';
 for(let i=1;i<pts.length-1;i++){
   ctx.fillStyle='#69ff6b';ctx.fillText(String(i),pts[i].x+6,pts[i].y-6);
 }
}

// Convert pointer from canvas CSS pixels to image coordinates.
function pos(e){
 const r=cv.getBoundingClientRect();
 return {x:(e.clientX-r.left)*imgW/r.width,y:(e.clientY-r.top)*imgH/r.height};
}
function nearestArm(p){
 const x=cursor.x,y=cursor.y;
 const L=58,gap=18,w=34; // deliberately wider touch target
 for(let i=0;i<4;i++){
   const a=pullAngle+i*Math.PI/2;
   const ux=Math.cos(a),uy=Math.sin(a);
   const ax=x+ux*gap,ay=y+uy*gap,bx=x+ux*(gap+L),by=y+uy*(gap+L);
   const vx=bx-ax,vy=by-ay, len2=vx*vx+vy*vy;
   const t=Math.max(0,Math.min(1,((p.x-ax)*vx+(p.y-ay)*vy)/len2));
   const qx=ax+vx*t,qy=ay+vy*t;
   if(Math.hypot(p.x-qx,p.y-qy)<=w)return i;
 }
 return -1;
}
cv.addEventListener('pointerdown',e=>{
 if(stage.hidden)return;
 cv.setPointerCapture(e.pointerId);
 const p=pos(e), arm=nearestArm(p);
 active=arm>=0?'move':'angle';
 lastX=p.x;lastY=p.y;
 e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
 if(!active)return;
 const p=pos(e);
 if(active==='move'){
   // Move the whole cursor with the selected arm; the arm stays in the hand.
   cursor.x=Math.max(0,Math.min(imgW,cursor.x+(p.x-lastX)));
   cursor.y=Math.max(0,Math.min(imgH,cursor.y+(p.y-lastY)));
 }else{
   pullAngle=Math.atan2(p.y-cursor.y,p.x-cursor.x);
 }
 lastX=p.x;lastY=p.y; draw();
 e.preventDefault();
});
function end(){active=null}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

plus.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();reflections=Math.min(20,reflections+1);nEl.textContent=reflections;draw();});
minus.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();reflections=Math.max(0,reflections-1);nEl.textContent=reflections;draw();});
plus.addEventListener('dblclick',e=>e.preventDefault());
minus.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('dblclick',e=>{ if(e.target===plus||e.target===minus){e.preventDefault();} },{passive:false});
hide.onclick=()=>{showLines=!showLines;hide.textContent=showLines?'線を消す':'線を表示';draw();};
</script>
</body>
</html>
