<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>モンスト反射シミュレーター</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Comic+Reggae&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;-webkit-text-size-adjust:100%;background:#111;color:#fff;font-family:"Comic Reggae","ComicReggae",-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;height:100%;overflow:hidden;touch-action:manipulation}
body{display:block;position:relative}
button{border:1px solid #3d4658;background:#242b38;color:#fff;border-radius:13px;height:56px;padding:0 14px;font-size:17px;font-weight:700;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:active{transform:scale(.97)}
html,body,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#bar{position:absolute;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(96vw,620px);max-width:calc(100vw - 8px);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;background:#151820;z-index:20;background:rgba(21,24,32,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);border-radius:14px}
#fileBtn{flex:1 1 190px;min-width:150px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#count{display:grid;grid-template-columns:56px 1fr 56px;gap:2px;flex:0 0 174px;align-items:center}
#count span{text-align:center;font-size:18px;font-weight:700;line-height:18px;display:flex;flex-direction:column;align-items:center;justify-content:center}#count span .maxLabel{font-size:9px;line-height:9px;height:9px;font-weight:700}#count span small{font-size:9px;font-weight:500;line-height:10px;opacity:.8}#count span.max .num{color:#ff3b3b}#angleControls{display:flex;align-items:center;gap:3px;flex:0 0 auto}#angleDisplay{font-size:17px;opacity:.95;white-space:nowrap;min-width:76px;text-align:center}#angleControls button{width:38px;min-width:38px;height:42px;padding:0;font-size:22px}
#minus,#plus{width:56px;min-width:56px;height:58px;padding:0;font-size:30px;touch-action:manipulation}
#zoomBtn{flex:0 0 100px;min-width:0;width:100%;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px}
#settingsBtn{flex:0 0 58px;height:44px;font-size:24px;padding:0}
#settingsPanel{display:none;flex:0 0 100%;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:6px 0 3px;border-top:1px solid #394151;position:relative}
#settingsPanel.open{display:flex}
#settingsBack{position:absolute;left:2px;top:4px;width:44px;min-width:44px;height:42px;padding:0;font-size:24px;z-index:2}
#settingsPanel .settingsChoices{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding-left:46px}
#settingsPanel button{height:42px;min-width:0;flex:1 1 120px;font-size:15px;padding:0 8px}
#adjust,#cursorAdjust,#menuAdjust{display:none;flex:0 0 100%;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:6px 0 3px;border-top:1px solid #394151}
#adjust .row,#cursorAdjust .row,#menuAdjust .row{display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
#adjust button,#cursorAdjust button,#menuAdjust button{height:38px;min-width:62px;padding:0 8px;font-size:16px;border-radius:9px}
#adjust .note{width:100%;text-align:center;font-size:11px;line-height:1.35;color:#ddd;padding:0 8px}
#wallReset,#cursorReset,#menuReset{color:#ff3b3b!important;border-color:#8a3030;background:#301c22}
#cursorSmaller,#cursorLarger{min-width:62px}
body.settings-mode #fileBtn,body.settings-mode #count,body.settings-mode #zoomBtn,body.settings-mode #angleControls{display:none!important}
body.settings-mode #settingsBtn{display:none!important}
body.settings-mode #settingsPanel{display:flex!important}
#wrap{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;overflow:hidden;background:#111}
#stage{position:relative;width:100%;height:100%;max-width:100%;max-height:100%;touch-action:none;transform-origin:center center}
#photo{display:block;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:16px;text-align:center;padding:30px;cursor:pointer}
#file{display:none}
@media(max-width:600px){
 #bar{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,174px) 100px;gap:7px;padding:8px}
 #fileBtn{grid-column:auto;min-width:0;width:100%;font-size:14px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #count{width:100%;min-width:0;grid-column:auto}
 #zoomBtn{width:100%;min-width:0;padding:0 3px;font-size:17px}
 #angleControls{justify-content:center}
 #angleDisplay{font-size:17px}
 #settingsBtn{grid-column:auto;width:58px;}
 #adjust,#cursorAdjust,#menuAdjust{grid-column:1/-1;max-height:34vh;overflow:auto}
}
@media(max-width:430px){
 #bar{grid-template-columns:minmax(0,1fr) 146px 82px;gap:5px;padding:6px}
 button{height:54px}
 #count{grid-template-columns:47px 1fr 47px;flex-basis:146px}
 #minus,#plus{width:47px;min-width:47px;height:54px;font-size:27px}
 #zoomBtn{font-size:17px;padding:0 2px}
 #angleControls button{width:34px;min-width:34px}
 #angleDisplay{font-size:16px;min-width:70px}
}
html::before,html::after,body::before,body::after{content:none!important;display:none!important}
 #bar.dragging{opacity:.92}
#bar{transform-origin:center center}
#zoomBtn.active{background:#52677e}
</style>
</head>
<body>
<div id="bar">
  <button id="fileBtn" type="button">画像を選択</button>
  <input id="file" type="file" accept="image/*">
  <div id="count">
    <button id="minus">−</button><span id="n"><b class="maxLabel"></b><strong class="num">3</strong><small>反射</small></span><button id="plus">＋</button>
  </div>
  <button id="zoomBtn">拡大</button>
  <button id="settingsBtn" aria-label="設定">⚙️</button>
  <div id="settingsPanel">
    <button id="settingsBack" type="button" aria-label="戻る">◁</button>
    <div class="settingsChoices">
      <button id="wallTab">壁を調整</button>
      <button id="cursorTab">カーソルを調整</button>
      <button id="menuTab">メニューサイズ調整</button>
    </div>
  </div>
  <div id="angleControls"><button id="angleMinus">−</button><span id="angleDisplay">角度 90°</span><button id="anglePlus">＋</button></div>
  <div id="adjust">
    <div class="row"><b>壁サイズ</b><button id="wallSmaller">小さく</button><button id="wallLarger">大きく</button></div>
    <div class="row"><b>壁位置</b><button id="wallLeft">左へ</button><button id="wallRight">右へ</button></div>
    <div class="row"><button id="wallReset">リセット</button></div>
    <div class="note">端末差によって壁判定がズレている時に使ってください</div>
  </div>
  <div id="cursorAdjust">
    <div class="row"><b>カーソルサイズ</b><button id="cursorSmaller">小さく</button><button id="cursorLarger">大きく</button></div>
    <div class="row"><button id="cursorReset">リセット</button></div>
  </div>
  <div id="menuAdjust">
    <div class="row"><b>メニューサイズ</b><button id="menuSmaller">小さく</button><button id="menuLarger">大きく</button></div>
    <div class="row"><button id="menuReset">リセット</button></div>
  </div>
</div>
<div id="wrap">
  <div id="empty">画像を選択</div>
  <div id="stage" hidden>
    <img id="photo" alt="">
    <canvas id="cv"></canvas>
  </div>
</div>
<script>
const file=document.getElementById('file'), fileBtn=document.getElementById('fileBtn');
const stage=document.getElementById('stage'), photo=document.getElementById('photo'), cv=document.getElementById('cv');
const ctx=cv.getContext('2d'), empty=document.getElementById('empty');
const nEl=document.getElementById('n'), plus=document.getElementById('plus'), minus=document.getElementById('minus'), hide=document.getElementById('hide');

let reflections=3, imgW=0,imgH=0; let zoomMode=false, zoomScale=1, zoomStartDist=0, zoomStartScale=1;
let cursor={x:0,y:0}; // image coordinates
let cursorSize=1;
// pullAngle is the direction from the ball toward the tapped/released position.
let pullAngle=-Math.PI/2;
let active=null, lastX=0,lastY=0;
let adjustMode=false;
let savedBarPosition=null;
let touchStartX=0,touchStartY=0;
let topY=296, bottomY=1030;
let leftX=54, rightX=1111;

fileBtn.onclick=()=>file.click();
empty.onclick=()=>{ if(stage.hidden) file.click(); };
file.onchange=e=>{
 const f=e.target.files?.[0]; if(!f)return;
 const url=URL.createObjectURL(f);
 // Remember the most recently selected image for the ⚡︎ button.
 photo.onload=()=>{
   imgW=photo.naturalWidth; imgH=photo.naturalHeight;
   stage.hidden=false; empty.hidden=true;
   fitStage();
   // Cursor starts at center of the actual game field, not at a random old touch point.
   const b=bounds();
   cursor.x=(b.l+b.r)/2; cursor.y=(b.t+b.b)/2;
   pullAngle=-Math.PI/2; updateAdjustUI(); updateAngleUI();
   draw();
 };
 photo.src=url;
};

function fitStage(){
 const wrapW=document.getElementById('wrap').clientWidth;
 const wrapH=document.getElementById('wrap').clientHeight;
 const scale=Math.min(wrapW/imgW,wrapH/imgH);
 stage.style.width=Math.round(imgW*scale)+'px';
 stage.style.height=Math.round(imgH*scale)+'px';
 cv.width=imgW; cv.height=imgH;
}
window.addEventListener('resize',()=>{if(!stage.hidden){fitStage();draw();}});

// Fixed field boundary, based on the blue boundary in the supplied reference.
// It scales with every screenshot by percentage, so the setting UI is unnecessary.
function bounds(){
 const topRatio=topY/1536, bottomRatio=bottomY/1536;
 return {l:leftX, r:rightX, t:topRatio*imgH, b:bottomRatio*imgH};
}

function draw(){
 if(!imgW)return;
 ctx.clearRect(0,0,imgW,imgH);
 const b=bounds();
 drawReflection(b);
 drawCursor();
 if(adjustMode) drawCalibration(b);
}

function updateAdjustUI(){}
function drawCalibration(b){
 ctx.save();
 ctx.setLineDash([12,8]);
 ctx.lineWidth=5;
 ctx.strokeStyle='rgba(0,220,255,.95)';
 ctx.beginPath();ctx.moveTo(b.l,b.t);ctx.lineTo(b.r,b.t);ctx.stroke();
 ctx.strokeStyle='rgba(255,100,80,.95)';
 ctx.beginPath();ctx.moveTo(b.l,b.b);ctx.lineTo(b.r,b.b);ctx.stroke();
 ctx.strokeStyle='rgba(120,255,180,.95)';
 ctx.beginPath();ctx.moveTo(b.l,b.t);ctx.lineTo(b.l,b.b);ctx.stroke();
 ctx.strokeStyle='rgba(180,140,255,.95)';
 ctx.beginPath();ctx.moveTo(b.r,b.t);ctx.lineTo(b.r,b.b);ctx.stroke();
 ctx.setLineDash([]);
 ctx.font='bold 24px "Comic Reggae","ComicReggae",-apple-system,BlinkMacSystemFont,sans-serif';
 ctx.fillStyle='#00eaff';ctx.fillText('上壁 Y='+Math.round(b.t),b.l+10,b.t-10);
 ctx.fillStyle='#ff806a';ctx.fillText('下壁 Y='+Math.round(b.b),b.l+10,b.b+30);
 ctx.fillStyle='#78ffb4';ctx.fillText('左壁 X='+Math.round(b.l),b.l+10,(b.t+b.b)/2);
 ctx.fillStyle='#b48cff';ctx.fillText('右壁 X='+Math.round(b.r),Math.max(b.l+10,b.r-190),(b.t+b.b)/2);
 ctx.restore();
 updateAdjustUI();
}

function drawCursor(){
 const x=cursor.x,y=cursor.y;
 // Reference-app style cursor: a large orange circular target around the ball center.
 const R=Math.max(68,Math.min(imgW,imgH)*0.065)*cursorSize;
 const rg=ctx.createRadialGradient(x,y,R*.15,x,y,R*1.75);
 rg.addColorStop(0,'rgba(255,150,35,.48)');
 rg.addColorStop(.45,'rgba(255,115,20,.28)');
 rg.addColorStop(1,'rgba(255,90,10,0)');
 ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,R*1.75,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='rgba(255,105,15,.13)';ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='rgba(255,95,15,.95)';ctx.lineWidth=7;ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle='rgba(255,225,145,.82)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,R+6,0,Math.PI*2);ctx.stroke();
 // Four thick white arms. They are the only move handles.
 const L=145*cursorSize, gap=R+7*cursorSize;
 for(let i=0;i<4;i++){
   const a=pullAngle + Math.PI/4 + i*Math.PI/2;
   const x1=x+Math.cos(a)*gap,y1=y+Math.sin(a)*gap;
   const x2=x+Math.cos(a)*(gap+L),y2=y+Math.sin(a)*(gap+L);
   ctx.strokeStyle='rgba(0,0,0,.16)';ctx.lineWidth=42*cursorSize;ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
   ctx.strokeStyle='rgba(255,255,255,.58)';ctx.lineWidth=30*cursorSize;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
   ctx.fillStyle='rgba(255,255,255,.58)';ctx.beginPath();ctx.arc(x2,y2,17*cursorSize,0,Math.PI*2);ctx.fill();
 }
}

function rayToSegment(px,py,dx,dy,x1,y1,x2,y2){
 const sx=x2-x1,sy=y2-y1;
 const den=dx*sy-dy*sx;
 if(Math.abs(den)<1e-9)return null;
 const t=((x1-px)*sy-(y1-py)*sx)/den;
 const u=((x1-px)*dy-(y1-py)*dx)/den;
 if(t>1e-7 && u>=0 && u<=1)return {t,u,x:px+dx*t,y:py+dy*t};
 return null;
}
function reflectPath(b){
 // Shoot directly toward the tapped/released position.
 let x=cursor.x,y=cursor.y;
 let dx=Math.cos(pullAngle),dy=Math.sin(pullAngle);
 // angle is the travel direction.
 const pts=[{x,y}];
 for(let k=0;k<reflections;k++){
   const hits=[
    rayToSegment(x,y,dx,dy,b.l,b.t,b.r,b.t),
    rayToSegment(x,y,dx,dy,b.r,b.t,b.r,b.b),
    rayToSegment(x,y,dx,dy,b.r,b.b,b.l,b.b),
    rayToSegment(x,y,dx,dy,b.l,b.b,b.l,b.t)
   ].filter(Boolean).sort((a,c)=>a.t-c.t);
   if(!hits.length)break;
   const h=hits[0]; pts.push({x:h.x,y:h.y});
   if(Math.abs(h.x-b.l)<1e-3||Math.abs(h.x-b.r)<1e-3) dx=-dx;
   else dy=-dy;
   x=h.x+dx*.05;y=h.y+dy*.05;
 }
 // Continue last segment to boundary/long distance.
 let ex=x+dx*Math.max(imgW,imgH)*2, ey=y+dy*Math.max(imgW,imgH)*2;
 const last= [
   rayToSegment(x,y,dx,dy,b.l,b.t,b.r,b.t),
   rayToSegment(x,y,dx,dy,b.r,b.t,b.r,b.b),
   rayToSegment(x,y,dx,dy,b.r,b.b,b.l,b.b),
   rayToSegment(x,y,dx,dy,b.l,b.b,b.l,b.t)
 ].filter(Boolean).sort((a,c)=>a.t-c.t)[0];
 if(last){ex=last.x;ey=last.y}
 pts.push({x:ex,y:ey});
 return pts;
}
function drawReflection(b){
 const pts=reflectPath(b);
 ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=7;
 // The first segment (0反射) is always red. Every segment after the
 // first wall hit is always white, regardless of the selected count.
 for(let i=0;i<pts.length-1;i++){
   ctx.strokeStyle = (i===0) ? 'rgba(255,55,55,.98)' : '#fff';
   ctx.beginPath();
   ctx.moveTo(pts[i].x,pts[i].y);
   ctx.lineTo(pts[i+1].x,pts[i+1].y);
   ctx.stroke();
 }
 // Larger hexagonal collision markers.
 for(let i=1;i<pts.length-1;i++){
   const p=pts[i], r=34;
   ctx.save();
   ctx.beginPath();
   for(let j=0;j<6;j++){
     const a=Math.PI/6+j*Math.PI/3;
     const xx=p.x+Math.cos(a)*r, yy=p.y+Math.sin(a)*r;
     if(j===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
   }
   ctx.closePath();
   ctx.fillStyle='rgba(40,255,255,.12)';ctx.fill();
   ctx.strokeStyle='rgba(40,255,255,.95)';ctx.lineWidth=6;ctx.stroke();
   ctx.font='bold 20px "Comic Reggae","ComicReggae",-apple-system,BlinkMacSystemFont,sans-serif';
   ctx.fillStyle='#69ff6b';ctx.fillText(String(i),p.x+40,p.y-35);
   ctx.restore();
 }
}
// Convert pointer from canvas CSS pixels to image coordinates.
function pos(e){
 const r=cv.getBoundingClientRect();
 return {x:(e.clientX-r.left)*imgW/r.width,y:(e.clientY-r.top)*imgH/r.height};
}
function nearestArm(p){
 const x=cursor.x,y=cursor.y;
 const R=Math.max(68,Math.min(imgW,imgH)*0.065)*cursorSize;
 const L=150*cursorSize,gap=R+5*cursorSize,w=58*cursorSize;
 for(let i=0;i<4;i++){
   const a=pullAngle+Math.PI/4+i*Math.PI/2;
   const ux=Math.cos(a),uy=Math.sin(a);
   const ax=x+ux*gap,ay=y+uy*gap,bx=x+ux*(gap+L),by=y+uy*(gap+L);
   const vx=bx-ax,vy=by-ay,len2=vx*vx+vy*vy;
   const t=Math.max(0,Math.min(1,((p.x-ax)*vx+(p.y-ay)*vy)/len2));
   const qx=ax+vx*t,qy=ay+vy*t;
   if(Math.hypot(p.x-qx,p.y-qy)<=w)return i;
 }
 return -1;
}
cv.addEventListener('pointerdown',e=>{
 if(stage.hidden || zoomMode)return;
 cv.setPointerCapture(e.pointerId);
 const p=pos(e), arm=nearestArm(p);
 active=arm>=0?'move':'angle';
 lastX=p.x;lastY=p.y;
 touchStartX=p.x;touchStartY=p.y;
 if(active==='angle'){
   const vx=p.x-cursor.x, vy=p.y-cursor.y;
   if(Math.hypot(vx,vy)>1) pullAngle=Math.atan2(-vy,-vx);
   updateAngleUI(); draw();
 }
 e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
 if(!active)return;
 const p=pos(e);
 if(active==='move'){
   // Move the whole cursor with the selected arm; the arm stays in the hand.
   cursor.x=Math.max(0,Math.min(imgW,cursor.x+(p.x-lastX)));
   cursor.y=Math.max(0,Math.min(imgH,cursor.y+(p.y-lastY)));
 }else{
   // 指を置いた位置→現在の指位置をベクトルとして、その向きをカーソル位置から描く。
   const vx=p.x-touchStartX, vy=p.y-touchStartY;
   if(Math.hypot(vx,vy)>2){
     const raw=Math.atan2(-vy,-vx);
     const deg=((Math.round(raw*180/Math.PI)%360)+360)%360;
     pullAngle=deg*Math.PI/180;
   }
 }
 lastX=p.x;lastY=p.y; updateAngleUI(); draw();
 e.preventDefault();
});
function updateAngleUI(){
 const deg=((pullAngle*180/Math.PI)%360+360)%360;
 const rounded=Math.round(deg)%360;
 document.getElementById('angleDisplay').textContent='角度 '+rounded+'°';
}
function end(e){
 if(active==='angle' && e){
   const p=pos(e);
   const vx=p.x-touchStartX, vy=p.y-touchStartY;
   if(Math.hypot(vx,vy)>2){
     const deg=((Math.round(Math.atan2(-vy,-vx)*180/Math.PI)%360)+360)%360;
     pullAngle=deg*Math.PI/180;
   }
   updateAngleUI(); draw();
 }
 active=null;
}

cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

function updateCount(){
  const num=nEl.querySelector('.num');
  const max=nEl.querySelector('.maxLabel');
  num.textContent=reflections;
  max.textContent=reflections===20?'MAX':'';
  nEl.classList.toggle('max',reflections===20);
}

const settingsBtn=document.getElementById('settingsBtn');
const settingsPanel=document.getElementById('settingsPanel');
const settingsBack=document.getElementById('settingsBack');
const wallTab=document.getElementById('wallTab'), cursorTab=document.getElementById('cursorTab'), menuTab=document.getElementById('menuTab');
const adjust=document.getElementById('adjust'), cursorAdjust=document.getElementById('cursorAdjust'), menuAdjust=document.getElementById('menuAdjust');
let barDrag=false, barDX=0, barDY=0;
const bar=document.getElementById('bar');
let menuScale=1, wallAdjustMode=false, cursorAdjustMode=false, menuAdjustMode=false;
let settingsOpen=false, settingsSubOpen=false, panelSavedPosition=null, panelMoved=false;
function applyBarTransform(){
  if(bar.style.left && bar.style.bottom==='auto'){bar.style.transformOrigin='top left';bar.style.transform=`scale(${menuScale})`;}
  else {bar.style.transformOrigin='center center';bar.style.transform=`translateX(-50%) scale(${menuScale})`;}
}
function isInteractiveBarTarget(el){return !!el.closest('button,input');}
bar.addEventListener('pointerdown',e=>{
 if(isInteractiveBarTarget(e.target))return; e.preventDefault();
 const r=bar.getBoundingClientRect(); barDrag=true; bar.classList.add('dragging');
 barDX=e.clientX-r.left; barDY=e.clientY-r.top; bar.style.left=r.left+'px';bar.style.top=r.top+'px';bar.style.bottom='auto';applyBarTransform();
 if(settingsSubOpen) panelMoved=true;
 bar.setPointerCapture?.(e.pointerId);
});
bar.addEventListener('pointermove',e=>{if(!barDrag)return;const r=bar.getBoundingClientRect();let x=e.clientX-barDX,y=e.clientY-barDY;x=Math.max(4,Math.min(innerWidth-r.width-4,x));y=Math.max(4,Math.min(innerHeight-r.height-4,y));bar.style.left=x+'px';bar.style.top=y+'px';});
function endBarDrag(){barDrag=false;bar.classList.remove('dragging');}
bar.addEventListener('pointerup',endBarDrag);bar.addEventListener('pointercancel',endBarDrag);
function hideSubPanels(){wallAdjustMode=false;cursorAdjustMode=false;menuAdjustMode=false;adjust.style.display='none';cursorAdjust.style.display='none';menuAdjust.style.display='none';}
function saveCurrentBarPosition(){const r=bar.getBoundingClientRect();panelSavedPosition={left:r.left,top:r.top};panelMoved=false;}
function restorePanelPosition(){
 if(!panelSavedPosition || panelMoved)return;
 bar.style.left=panelSavedPosition.left+'px';bar.style.top=panelSavedPosition.top+'px';bar.style.bottom='auto';applyBarTransform();
}
function liftBar(){const r=bar.getBoundingClientRect(),h=bar.offsetHeight;let top=r.top;if(top+h>innerHeight-4)top=Math.max(4,innerHeight-h-4);if(top<4)top=4;bar.style.left=r.left+'px';bar.style.top=top+'px';bar.style.bottom='auto';applyBarTransform();}
function enterSettings(){
 settingsOpen=true;settingsSubOpen=false;document.body.classList.add('settings-mode');hideSubPanels();settingsPanel.classList.add('open');
 saveCurrentBarPosition();
}
function exitSettings(){
 hideSubPanels();settingsSubOpen=false;settingsOpen=false;document.body.classList.remove('settings-mode');settingsPanel.classList.remove('open');
}
settingsBtn.onclick=()=>{if(settingsOpen)exitSettings();else enterSettings();};
settingsBack.onclick=()=>{
 if(settingsSubOpen){
   restorePanelPosition(); hideSubPanels(); settingsSubOpen=false; panelSavedPosition=null;
 }else exitSettings();
};
function openPanel(kind){
 if(!settingsOpen)enterSettings();
 hideSubPanels();
 if(!settingsSubOpen) saveCurrentBarPosition();
 settingsSubOpen=true;
 if(kind==='wall'){wallAdjustMode=true;adjust.style.display='flex';}
 if(kind==='cursor'){cursorAdjustMode=true;cursorAdjust.style.display='flex';}
 if(kind==='menu'){menuAdjustMode=true;menuAdjust.style.display='flex';}
 // Settings view itself is replaced by the selected adjustment panel; the ◁ remains.
 settingsPanel.style.display='none';
 liftBar();
 draw();
}
wallTab.onclick=()=>openPanel('wall');
cursorTab.onclick=()=>openPanel('cursor');
menuTab.onclick=()=>openPanel('menu');

function shiftWallsX(delta){
 const w=rightX-leftX; let nl=leftX+delta,nr=rightX+delta;
 if(nl<0){nr-=nl;nl=0;} if(nr>imgW){nl-=nr-imgW;nr=imgW;}
 leftX=Math.max(0,nl); rightX=Math.min(imgW,nr); draw();
}
function scaleWalls(factor){
 const cx=(leftX+rightX)/2, cy=(topY+bottomY)/2;
 const halfW=(rightX-leftX)/2, halfH=(bottomY-topY)/2;
 const nhW=Math.max(10,halfW*factor), nhH=Math.max(10,halfH*factor);
 leftX=Math.max(0,cx-nhW); rightX=Math.min(imgW,cx+nhW);
 topY=Math.max(0,cy-nhH); bottomY=Math.min(imgH,cy+nhH); draw();
}
document.getElementById('wallSmaller').onclick=()=>scaleWalls(0.98);
document.getElementById('wallLarger').onclick=()=>scaleWalls(1.02);
document.getElementById('wallLeft').onclick=()=>shiftWallsX(-Math.max(2,imgW*0.01));
document.getElementById('wallRight').onclick=()=>shiftWallsX(Math.max(2,imgW*0.01));
document.getElementById('wallReset').onclick=()=>{topY=296;bottomY=1030;leftX=54;rightX=1111;draw();};
document.getElementById('cursorSmaller').onclick=()=>{cursorSize=Math.max(.55,cursorSize-.05);draw();};
document.getElementById('cursorLarger').onclick=()=>{cursorSize=Math.min(1.6,cursorSize+.05);draw();};
document.getElementById('cursorReset').onclick=()=>{cursorSize=1;draw();};
function changeMenuScale(delta){
 const r=bar.getBoundingClientRect();
 const cx=r.left+r.width/2, cy=r.top+r.height/2;
 menuScale=Math.max(.75,Math.min(1.3,menuScale+delta));
 bar.style.left=(cx-(r.width*menuScale/menuScale)/2)+'px';
 bar.style.top=(cy-(r.height*menuScale/menuScale)/2)+'px';
 bar.style.bottom='auto';
 applyBarTransform();
 const nr=bar.getBoundingClientRect();
 bar.style.left=(cx-nr.width/2)+'px';bar.style.top=(cy-nr.height/2)+'px';applyBarTransform();
 if(settingsSubOpen)panelMoved=true;
}
document.getElementById('menuSmaller').onclick=()=>changeMenuScale(-.05);
document.getElementById('menuLarger').onclick=()=>changeMenuScale(.05);
document.getElementById('menuReset').onclick=()=>{menuScale=1;applyBarTransform();};

const angleMinus=document.getElementById('angleMinus'), anglePlus=document.getElementById('anglePlus');
function changeAngle(delta){let deg=((pullAngle*180/Math.PI)%360+360)%360;deg=(Math.round(deg)+delta+360)%360;pullAngle=deg*Math.PI/180;updateAngleUI();draw();}

// 長押し対応：最初は即時、その後は滑らかに連続変更
function bindRepeat(btn,fn){
 let timeout=null, stopped=false, step=0;
 const delays=[350,300,260,220,185,155,130,105,85,70,55];
 const stop=()=>{stopped=true;if(timeout){clearTimeout(timeout);timeout=null;}};
 const tick=()=>{
   if(stopped)return;
   fn();
   step=Math.min(step+1,delays.length-1);
   timeout=setTimeout(tick,delays[step]);
 };
 btn.addEventListener('pointerdown',e=>{
   e.preventDefault();e.stopPropagation();stopped=false;step=0;fn();
   timeout=setTimeout(tick,delays[0]);
   btn.setPointerCapture?.(e.pointerId);
 });
 ['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,stop));
}
bindRepeat(plus,()=>{reflections=reflections===20?0:reflections+1;updateCount();draw();});
bindRepeat(minus,()=>{reflections=reflections===0?20:reflections-1;updateCount();draw();});
bindRepeat(anglePlus,()=>changeAngle(1));
bindRepeat(angleMinus,()=>changeAngle(-1));
updateCount();

const zoomBtn=document.getElementById('zoomBtn');
let panX=0,panY=0,panStartX=0,panStartY=0,panBaseX=0,panBaseY=0,panActive=false;
function applyStageTransform(){stage.style.transform=`translate3d(${panX}px,${panY}px,0) scale(${zoomScale})`;}
zoomBtn.onclick=()=>{
 zoomMode=!zoomMode;
 zoomBtn.textContent=zoomMode?'解除':'拡大';
 zoomBtn.classList.toggle('active',zoomMode);
 if(!zoomMode){zoomScale=1;panX=0;panY=0;applyStageTransform();}else active=null;
};
function touchDist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
cv.addEventListener('touchstart',e=>{
 if(!zoomMode)return;
 if(e.touches.length===2){
   e.preventDefault(); panActive=false;
   zoomStartDist=touchDist(e.touches[0],e.touches[1]); zoomStartScale=zoomScale;
 }else if(e.touches.length===1){
   e.preventDefault();
   panActive=true; panStartX=e.touches[0].clientX; panStartY=e.touches[0].clientY; panBaseX=panX; panBaseY=panY;
 }
},{passive:false});
cv.addEventListener('touchmove',e=>{
 if(!zoomMode)return;
 if(e.touches.length===2){
   e.preventDefault(); panActive=false;
   const d=touchDist(e.touches[0],e.touches[1]);
   if(zoomStartDist>0){zoomScale=Math.max(1,Math.min(4,zoomStartScale*d/zoomStartDist));applyStageTransform();}
 }else if(e.touches.length===1 && panActive){
   e.preventDefault();
   panX=panBaseX+(e.touches[0].clientX-panStartX);
   panY=panBaseY+(e.touches[0].clientY-panStartY);
   applyStageTransform();
 }
},{passive:false});
cv.addEventListener('touchend',e=>{if(zoomMode && e.touches.length===0)panActive=false;},{passive:false});
document.addEventListener('selectstart',e=>e.preventDefault(),{passive:false});
document.addEventListener('copy',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
</script>
