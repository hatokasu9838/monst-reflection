<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>モンスト反射シミュレーター</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;height:100%;overflow:hidden;touch-action:manipulation}
body{display:flex;flex-direction:column}
button{border:1px solid #3d4658;background:#242b38;color:#fff;border-radius:13px;height:56px;padding:0 14px;font-size:17px;font-weight:700;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:active{transform:scale(.97)}
html,body,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#bar{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px;background:#151820;z-index:20}
#fileBtn{flex:1 1 190px;min-width:150px}
#count{display:grid;grid-template-columns:56px 1fr 56px;gap:2px;flex:0 0 174px;align-items:center}
#count span{text-align:center;font-size:18px;font-weight:700}
#minus,#plus{width:56px;min-width:56px;height:58px;padding:0;font-size:30px;touch-action:manipulation}
#hide{flex:0 0 100px;min-width:100px}
#adjustBtn{flex:0 0 100%;height:38px;font-size:14px;display:block}
#adjust{display:none;flex:0 0 100%;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:4px 0 2px;border-top:1px solid #394151}
#adjust .row{display:flex;align-items:center;gap:5px}
#adjust button{height:38px;min-width:44px;padding:0;font-size:18px;border-radius:9px}
#adjust .coord{min-width:70px;text-align:center;font-size:13px}
#wrap{position:relative;flex:1;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;background:#111}
#stage{position:relative;max-width:100%;max-height:100%;touch-action:none}
#photo{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:16px;text-align:center;padding:30px}
#file{display:none}
@media(max-width:600px){
 #bar{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,174px) 100px;gap:7px;padding:8px}
 #fileBtn{grid-column:auto;min-width:0;width:100%;font-size:14px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #count{width:100%;min-width:0;grid-column:auto}
 #hide{width:100%;min-width:0;font-size:14px;padding:0 5px}
 #adjustBtn{grid-column:1/-1;width:100%;}
 #adjust{grid-column:1/-1}
}
@media(max-width:430px){
 #bar{grid-template-columns:minmax(0,1fr) 146px 82px;gap:5px;padding:6px}
 button{height:54px}
 #count{grid-template-columns:47px 1fr 47px;flex-basis:146px}
 #minus,#plus{width:47px;min-width:47px;height:54px;font-size:27px}
 #hide{font-size:12px}
}
</style>>
</head>
<body>
<div id="bar">
  <button id="fileBtn">📷 スクショを選択</button>
  <input id="file" type="file" accept="image/*">
  <div id="count">
    <button id="minus">−</button><span id="n">3</span><button id="plus">＋</button>
  </div>
  <button id="hide">線を消す</button>
  <div id="adjust">
    <div class="row"><b>上</b><button id="topUp">↑</button><button id="topDown">↓</button><span id="topY" class="coord">Y:0</span></div>
    <div class="row"><b>下</b><button id="botUp">↑</button><button id="botDown">↓</button><span id="botY" class="coord">Y:0</span></div>
  </div>
</div>
<div id="wrap">
  <div id="empty">スクショを選択してください</div>
  <div id="stage" hidden>
    <img id="photo" alt="">
    <canvas id="cv"></canvas>
  </div>
</div>
<script>
const file=document.getElementById('file'), fileBtn=document.getElementById('fileBtn');
const stage=document.getElementById('stage'), photo=document.getElementById('photo'), cv=document.getElementById('cv');
const ctx=cv.getContext('2d'), empty=document.getElementById('empty');
const nEl=document.getElementById('n'), plus=document.getElementById('plus'), minus=document.getElementById('minus'), hide=document.getElementById('hide');

let reflections=3, showLines=true, imgW=0,imgH=0;
let cursor={x:0,y:0}; // image coordinates
// pullAngle is the direction the user pulls the ball. The actual shot travels exactly 180° opposite.
let pullAngle=-Math.PI/4;
let active=null, lastX=0,lastY=0;
let adjustMode=false;
let topY=481, bottomY=1695;

fileBtn.onclick=()=>file.click();
file.onchange=e=>{
 const f=e.target.files?.[0]; if(!f)return;
 const url=URL.createObjectURL(f);
 // Remember the most recently selected image for the ⚡︎ button.
 const reader=new FileReader(); reader.onload=()=>{try{localStorage.setItem('monstLatestImage',reader.result)}catch(_){}}; reader.readAsDataURL(f);
 photo.onload=()=>{
   imgW=photo.naturalWidth; imgH=photo.naturalHeight;
   stage.hidden=false; empty.hidden=true;
   fitStage();
   // Cursor starts at center of the actual game field, not at a random old touch point.
   const b=bounds();
   cursor.x=(b.l+b.r)/2; cursor.y=(b.t+b.b)/2;
   pullAngle=-Math.PI/4; showLines=true; updateAdjustUI();
   draw();
 };
 photo.src=url;
};

function fitStage(){
 const wrapW=document.getElementById('wrap').clientWidth;
 const wrapH=document.getElementById('wrap').clientHeight;
 const scale=Math.min(wrapW/imgW,wrapH/imgH);
 stage.style.width=Math.round(imgW*scale)+'px';
 stage.style.height=Math.round(imgH*scale)+'px';
 cv.width=imgW; cv.height=imgH;
}
window.addEventListener('resize',()=>{if(!stage.hidden){fitStage();draw();}});

// Fixed field boundary, based on the blue boundary in the supplied reference.
// It scales with every screenshot by percentage, so the setting UI is unnecessary.
function bounds(){
 const topRatio=topY/1536, bottomRatio=bottomY/1536;
 return {l:0.046*imgW, r:0.954*imgW, t:topRatio*imgH, b:bottomRatio*imgH};
}

function draw(){
 if(!imgW)return;
 ctx.clearRect(0,0,imgW,imgH);
 if(!showLines)return;
 const b=bounds();
 drawReflection(b);
 drawCursor();
 if(adjustMode) drawCalibration(b);
}

function updateAdjustUI(){
 topY=Math.round(topY); bottomY=Math.round(bottomY);
 document.getElementById('topY').textContent='Y:'+topY;
 document.getElementById('botY').textContent='Y:'+bottomY;
}
function drawCalibration(b){
 ctx.save();
 ctx.setLineDash([12,8]);
 ctx.lineWidth=5;
 ctx.strokeStyle='rgba(0,220,255,.95)';
 ctx.beginPath();ctx.moveTo(b.l,b.t);ctx.lineTo(b.r,b.t);ctx.stroke();
 ctx.strokeStyle='rgba(255,100,80,.95)';
 ctx.beginPath();ctx.moveTo(b.l,b.b);ctx.lineTo(b.r,b.b);ctx.stroke();
 ctx.setLineDash([]);
 ctx.font='bold 24px -apple-system,BlinkMacSystemFont,sans-serif';
 ctx.fillStyle='#00eaff';ctx.fillText('上壁 Y='+b.t,b.l+10,b.t-10);
 ctx.fillStyle='#ff806a';ctx.fillText('下壁 Y='+b.b,b.l+10,b.b+30);
 ctx.restore();
 updateAdjustUI();
}

function drawCursor(){
 const x=cursor.x,y=cursor.y;
 // Reference-app style cursor: a large orange circular target around the ball center.
 const R=Math.max(68,Math.min(imgW,imgH)*0.065);
 const rg=ctx.createRadialGradient(x,y,R*.15,x,y,R*1.75);
 rg.addColorStop(0,'rgba(255,150,35,.48)');
 rg.addColorStop(.45,'rgba(255,115,20,.28)');
 rg.addColorStop(1,'rgba(255,90,10,0)');
 ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,R*1.75,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='rgba(255,105,15,.13)';ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='rgba(255,95,15,.95)';ctx.lineWidth=7;ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.stroke();
 ctx.strokeStyle='rgba(255,225,145,.82)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,R+6,0,Math.PI*2);ctx.stroke();
 // Four thick white arms. They are the only move handles.
 const L=100, gap=R+10, w=34;
 for(let i=0;i<4;i++){
   const a=pullAngle + i*Math.PI/2;
   const x1=x+Math.cos(a)*gap,y1=y+Math.sin(a)*gap;
   const x2=x+Math.cos(a)*(gap+L),y2=y+Math.sin(a)*(gap+L);
   ctx.strokeStyle='rgba(0,0,0,.24)';ctx.lineWidth=w+9;ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
   ctx.strokeStyle='#fff';ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 }
}

function rayToSegment(px,py,dx,dy,x1,y1,x2,y2){
 const sx=x2-x1,sy=y2-y1;
 const den=dx*sy-dy*sx;
 if(Math.abs(den)<1e-9)return null;
 const t=((x1-px)*sy-(y1-py)*sx)/den;
 const u=((x1-px)*dy-(y1-py)*dx)/den;
 if(t>1e-7 && u>=0 && u<=1)return {t,u,x:px+dx*t,y:py+dy*t};
 return null;
}
function reflectPath(b){
 // Shoot opposite the drag/aim direction, like Monster Strike.
 let x=cursor.x,y=cursor.y;
 let dx=Math.cos(pullAngle+Math.PI),dy=Math.sin(pullAngle+Math.PI);
 // angle is the travel direction.
 const pts=[{x,y}];
 for(let k=0;k<reflections;k++){
   const hits=[
    rayToSegment(x,y,dx,dy,b.l,b.t,b.r,b.t),
    rayToSegment(x,y,dx,dy,b.r,b.t,b.r,b.b),
    rayToSegment(x,y,dx,dy,b.r,b.b,b.l,b.b),
    rayToSegment(x,y,dx,dy,b.l,b.b,b.l,b.t)
   ].filter(Boolean).sort((a,c)=>a.t-c.t);
   if(!hits.length)break;
   const h=hits[0]; pts.push({x:h.x,y:h.y});
   if(Math.abs(h.x-b.l)<1e-3||Math.abs(h.x-b.r)<1e-3) dx=-dx;
   else dy=-dy;
   x=h.x+dx*.05;y=h.y+dy*.05;
 }
 // Continue last segment to boundary/long distance.
 let ex=x+dx*Math.max(imgW,imgH)*2, ey=y+dy*Math.max(imgW,imgH)*2;
 const last= [
   rayToSegment(x,y,dx,dy,b.l,b.t,b.r,b.t),
   rayToSegment(x,y,dx,dy,b.r,b.t,b.r,b.b),
   rayToSegment(x,y,dx,dy,b.r,b.b,b.l,b.b),
   rayToSegment(x,y,dx,dy,b.l,b.b,b.l,b.t)
 ].filter(Boolean).sort((a,c)=>a.t-c.t)[0];
 if(last){ex=last.x;ey=last.y}
 pts.push({x:ex,y:ey});
 return pts;
}
function drawReflection(b){
 const pts=reflectPath(b);
 ctx.strokeStyle='rgba(255,255,255,.98)';
 ctx.lineWidth=7;
 ctx.lineCap='round';ctx.lineJoin='round';
 ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
 for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
 ctx.stroke();
 // Cyan hexagonal collision markers, like the reference reflection app.
 for(let i=1;i<pts.length-1;i++){
   const p=pts[i], r=24;
   ctx.save();
   ctx.beginPath();
   for(let j=0;j<6;j++){
     const a=Math.PI/6+j*Math.PI/3;
     const xx=p.x+Math.cos(a)*r, yy=p.y+Math.sin(a)*r;
     if(j===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
   }
   ctx.closePath();
   ctx.fillStyle='rgba(40,255,255,.12)';ctx.fill();
   ctx.strokeStyle='rgba(40,255,255,.95)';ctx.lineWidth=6;ctx.stroke();
   ctx.font='bold 20px -apple-system,BlinkMacSystemFont,sans-serif';
   ctx.fillStyle='#69ff6b';ctx.fillText(String(i),p.x+30,p.y-25);
   ctx.restore();
 }
}

// Convert pointer from canvas CSS pixels to image coordinates.
function pos(e){
 const r=cv.getBoundingClientRect();
 return {x:(e.clientX-r.left)*imgW/r.width,y:(e.clientY-r.top)*imgH/r.height};
}
function nearestArm(p){
 const x=cursor.x,y=cursor.y;
 const R=Math.max(68,Math.min(imgW,imgH)*0.065);
 const L=104,gap=R+8,w=52;
 for(let i=0;i<4;i++){
   const a=pullAngle+i*Math.PI/2;
   const ux=Math.cos(a),uy=Math.sin(a);
   const ax=x+ux*gap,ay=y+uy*gap,bx=x+ux*(gap+L),by=y+uy*(gap+L);
   const vx=bx-ax,vy=by-ay,len2=vx*vx+vy*vy;
   const t=Math.max(0,Math.min(1,((p.x-ax)*vx+(p.y-ay)*vy)/len2));
   const qx=ax+vx*t,qy=ay+vy*t;
   if(Math.hypot(p.x-qx,p.y-qy)<=w)return i;
 }
 return -1;
}
cv.addEventListener('pointerdown',e=>{
 if(stage.hidden)return;
 cv.setPointerCapture(e.pointerId);
 const p=pos(e), arm=nearestArm(p);
 active=arm>=0?'move':'angle';
 lastX=p.x;lastY=p.y;
 e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
 if(!active)return;
 const p=pos(e);
 if(active==='move'){
   // Move the whole cursor with the selected arm; the arm stays in the hand.
   cursor.x=Math.max(0,Math.min(imgW,cursor.x+(p.x-lastX)));
   cursor.y=Math.max(0,Math.min(imgH,cursor.y+(p.y-lastY)));
 }else{
   let a=Math.atan2(p.y-cursor.y,p.x-cursor.x);
  // Snap very close to the four cardinal directions so straight pulls stay perfectly straight.
  const q=Math.PI/2, snap=3*Math.PI/180;
  const k=Math.round(a/q)*q;
  pullAngle=(Math.abs(a-k)<snap)?k:a;
 }
 lastX=p.x;lastY=p.y; draw();
 e.preventDefault();
});
function end(){active=null}
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

plus.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();reflections=Math.min(20,reflections+1);nEl.textContent=reflections;draw();});
minus.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();reflections=Math.max(0,reflections-1);nEl.textContent=reflections;draw();});
plus.addEventListener('dblclick',e=>e.preventDefault());
minus.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('dblclick',e=>{ if(e.target===plus||e.target===minus){e.preventDefault();} },{passive:false});
const adjustBtn=document.getElementById('adjustBtn'), adjust=document.getElementById('adjust');
adjustBtn.onclick=()=>{adjustMode=!adjustMode;adjust.style.display=adjustMode?'flex':'none';adjustBtn.textContent=adjustMode?'調整終了':'壁を調整';updateAdjustUI();draw();};
function moveWall(which,delta){ if(which==='top') topY=Math.max(0,Math.min(bottomY-20,topY+delta)); else bottomY=Math.max(topY+20,Math.min(imgH,bottomY+delta)); updateAdjustUI(); draw(); }
document.getElementById('topUp').onclick=()=>moveWall('top',-5);
document.getElementById('topDown').onclick=()=>moveWall('top',5);
document.getElementById('botUp').onclick=()=>moveWall('bottom',-5);
document.getElementById('botDown').onclick=()=>moveWall('bottom',5);
hide.onclick=()=>{showLines=!showLines;hide.textContent=showLines?'線を消す':'線を表示';draw();};
document.addEventListener('selectstart',e=>e.preventDefault(),{passive:false});
document.addEventListener('copy',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
</script>
</body>
</html>
